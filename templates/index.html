<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слоты - Веб-версия игры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
        }

        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .balance {
            font-size: 18px;
            font-weight: bold;
        }

        .btn-logout, .btn-history {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-logout:hover, .btn-history:hover {
            transform: translateY(-2px);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .game-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .slot {
            width: 80px;
            height: 100px;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            background: #f0f0f0;
            animation: spin 0.6s ease-out;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .controls {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .result.win {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            display: block;
        }

        .result.loss {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }

        .result.jackpot {
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
            display: block;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .result-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .win-amount {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎰 Слоты</h1>
        </div>
        <div class="user-info">
            <span style="font-size: 18px;">{{ user.username }}</span>
            <div class="balance">Баланс: <span id="balance">{{ user.balance }}</span>₽</div>
            <button class="btn-history" onclick="window.location.href='/history'">История</button>
            <button class="btn-logout" onclick="window.location.href='/logout'">Выход</button>
        </div>
    </div>

    <div class="container">
        <div class="game-title">Крутите слоты и выигрывайте!</div>

        <div class="slot-machine" id="slotMachine">
            <div class="slot">🍎</div>
            <div class="slot">🍊</div>
            <div class="slot">🍋</div>
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="bet">Ставка (₽):</label>
                <input type="number" id="bet" min="1" value="10">
            </div>

            <div class="button-group">
                <button onclick="spin()" id="spinBtn">🔄 Крутить!</button>
            </div>
        </div>

        <div class="result" id="result">
            <div class="result-text" id="resultText"></div>
            <div class="win-amount" id="winAmount"></div>
        </div>
    </div>

    <script>
        async function spin() {
            const betInput = document.getElementById('bet');
            const bet = parseFloat(betInput.value);
            const spinBtn = document.getElementById('spinBtn');
            const balanceSpan = document.getElementById('balance');

            if (bet <= 0) {
                alert('Ставка должна быть больше 0');
                return;
            }

            if (bet > parseFloat(balanceSpan.textContent)) {
                alert('Недостаточно средств');
                return;
            }

            spinBtn.disabled = true;

            try {
                const response = await fetch('/spin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ bet: bet })
                });

                const data = await response.json();

                const slots = document.querySelectorAll('.slot');
                slots.forEach((slot, index) => {
                    slot.textContent = data.symbols[index];
                });

                balanceSpan.textContent = data.new_balance.toFixed(2);

                const resultDiv = document.getElementById('result');
                const resultText = document.getElementById('resultText');
                const winAmount = document.getElementById('winAmount');

                resultDiv.className = 'result';

                if (data.result === 'jackpot') {
                    resultDiv.classList.add('jackpot');
                    resultText.textContent = '🎉 ДЖЕКПОТ! 🎉';
                    winAmount.textContent = `Вы выиграли: ${data.win}₽`;
                } else if (data.result === 'win') {
                    resultDiv.classList.add('win');
                    resultText.textContent = '✅ Выигрыш!';
                    winAmount.textContent = `Вы выиграли: ${data.win}₽`;
                } else {
                    resultDiv.classList.add('loss');
                    resultText.textContent = '❌ Проигрыш';
                    winAmount.textContent = `Вы потеряли: ${bet}₽`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при обработке ставки');
            } finally {
                spinBtn.disabled = false;
            }
        }

        // Обновление баланса каждые 5 секунд
        setInterval(async () => {
            try {
                const response = await fetch('/balance');
                const data = await response.json();
                document.getElementById('balance').textContent = data.balance.toFixed(2);
            } catch (error) {
                console.error('Ошибка обновления баланса:', error);
            }
        }, 5000);

        // Enter для ставки
        document.getElementById('bet').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') spin();
        });
    </script>
